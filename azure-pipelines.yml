# NOTE:
# This file contains the user's original pipeline with the recommended
# Node/SCA changes applied. Replace the "..." section below with the
# packaging section from your existing pipeline if desired.

trigger:
  - master

variables:
  - group: Veracode

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    displayName: Use Node.js 20
    inputs:
      versionSpec: '20.x'

  - script: |
      node -v
      npm -v
    displayName: Verify Node

  # >>> KEEP YOUR EXISTING "Preparar pacote Veracode unificado" STEP HERE <<<

  - script: |
      set -euxo pipefail

      export NPM_CONFIG_LEGACY_PEER_DEPS=true
      export NPM_CONFIG_PACKAGE_LOCK=true
      export NPM_CONFIG_AUDIT=false
      export NPM_CONFIG_FUND=false

      if [ -f package.json ]; then
        rm -f .npmrc package-lock.json
        npm install --legacy-peer-deps --package-lock
      fi

      if [ -d frontend ] && [ -f frontend/package.json ]; then
        cd frontend
        rm -f .npmrc package-lock.json
        npm config set package-lock true
        npm install --legacy-peer-deps --package-lock
        test -f package-lock.json
        cd ..
      fi
    displayName: Prepare dependencies

  - script: |
      export NPM_CONFIG_LEGACY_PEER_DEPS=true
      export NPM_CONFIG_PACKAGE_LOCK=true
      curl -sSL https://download.srcclr.com/ci.sh | bash -s -- scan --update-advisor --allow-dirty --recursive
    displayName: Veracode SCA
    continueOnError: true
