trigger:
  - master

variables:
  - group: Veracode

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    displayName: Use Node.js 20
    inputs:
      versionSpec: '20.x'

  - script: |
      set -euxo pipefail
      node -v
      npm -v
    displayName: Verify Node

  - script: |
      set -euxo pipefail

      export NPM_CONFIG_LEGACY_PEER_DEPS=true
      export NPM_CONFIG_PACKAGE_LOCK=true
      export NPM_CONFIG_AUDIT=false
      export NPM_CONFIG_FUND=false
      export NPM_CONFIG_IGNORE_SCRIPTS=true

      npm install --package-lock-only --legacy-peer-deps --ignore-scripts
      test -f package-lock.json

      npm --prefix frontend install --package-lock-only --legacy-peer-deps --ignore-scripts
      test -f frontend/package-lock.json
      test ! -f build/package.json
    displayName: Prepare npm lockfiles for SCA

  - script: |
      set -euxo pipefail

      curl -sSL https://sca-downloads.veracode.com/ci.sh -o srcclr-ci.sh
      chmod +x srcclr-ci.sh
    displayName: Download Veracode SCA agent

  - script: |
      set -euxo pipefail

      export NPM_CONFIG_LEGACY_PEER_DEPS=true
      export NPM_CONFIG_PACKAGE_LOCK=true
      export NPM_CONFIG_AUDIT=false
      export NPM_CONFIG_FUND=false
      export NPM_CONFIG_IGNORE_SCRIPTS=true
      export SRCCLR_SCAN_COLLECTORS="npm quickscan"
      export SRCCLR_JAVA_OPTS="-Xmx4096m"

      bash srcclr-ci.sh scan --quick --recursive --update-advisor --allow-dirty .
    displayName: Veracode SCA
    continueOnError: true

  # >>> KEEP YOUR EXISTING "Preparar pacote Veracode unificado" STEP HERE <<<
